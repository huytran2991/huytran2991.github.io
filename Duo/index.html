<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ee">
  <title>Duo Lớp 3 · Global Success</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="units.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top"><span><span aria-hidden="true">🌱</span> Duo Lớp 3</span><span id="stars"></span></header>
  <main id="app">
    <noscript>Hãy bật JavaScript trong trình duyệt để bắt đầu luyện tập.</noscript>
  </main>
  <footer>Tiếng Anh 3 · Global Success · Tập 1</footer>
  <template id="home-template">
    <section class="hero">
      <p class="tag">GLOBAL SUCCESS · TẬP 1</p>
      <h1 tabindex="-1">Mỗi ngày, một chút tiếng Anh!</h1>
      <p>Chọn bài trong sách rồi cùng nghe, đọc và viết.</p>
    </section>
    <details class="voice-settings">
      <summary>🔊 Chọn giọng đọc</summary>
      <label for="voice">Giọng tiếng Anh</label>
      <div class="voice-controls">
        <select id="voice"></select>
        <button type="button" id="voice-preview">Nghe thử</button>
      </div>
      <p id="voice-status" class="audio-status" role="status"></p>
    </details>
    <h2>Chọn Unit</h2>
    <div class="unit-grid"></div>
  </template>
</body>
</html>

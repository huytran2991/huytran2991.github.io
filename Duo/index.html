<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ee">
  <title>Duo Lớp 3 · Global Success</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="translation-ai.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <span><span aria-hidden="true">🌱</span> Duo Lớp 3</span>
    <div class="duo-account">
      <button type="button" id="duo-login" disabled>Login</button>
      <span id="duo-email" hidden></span>
      <button type="button" id="duo-logout" hidden>Logout</button>
      <span id="duo-account-status" role="status"></span>
    </div>
    <span id="stars"></span>
  </header>
  <main id="app">
    <p role="status">Đang tải bài học…</p>
    <noscript>Hãy bật JavaScript trong trình duyệt để bắt đầu luyện tập.</noscript>
  </main>
  <footer>Tiếng Anh 3 · Global Success · Tập 1</footer>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-heading">
      <h2 id="settings-title">Cài đặt</h2>
      <form method="dialog">
        <button type="submit" aria-label="Đóng cài đặt"><span aria-hidden="true">✕</span></button>
      </form>
    </div>
    <section class="settings-section" aria-labelledby="voice-title">
      <h3 id="voice-title">Giọng đọc</h3>
      <label for="voice">Giọng tiếng Anh</label>
      <div class="voice-controls">
        <select id="voice"></select>
        <button type="button" id="voice-preview">Nghe thử</button>
      </div>
      <p id="voice-status" class="audio-status" role="status"></p>
    </section>
    <section class="settings-section" id="gemini-settings" aria-labelledby="gemini-title">
      <h3 id="gemini-title">Cấu hình AI · Gemini</h3>
      <form id="gemini-form">
        <label for="gemini-key">Gemini API key</label>
        <input id="gemini-key" type="password" maxlength="256" autocomplete="off" spellcheck="false" required autofocus>
        <div class="actions">
          <button type="submit" class="primary">Lưu API key</button>
          <button type="button" id="gemini-remove">Xóa API key</button>
        </div>
      </form>
      <p id="gemini-status" class="audio-status" role="status"></p>
      <p>Khi đăng nhập, Duo dùng chung key với English Practice. Khi chấm bài dịch, đề và câu trả lời được gửi đến Google Gemini.</p>
    </section>
  </dialog>
  <template id="home-template">
    <section class="hero">
      <button type="button" id="open-settings" aria-label="Cài đặt" aria-haspopup="dialog" title="Cài đặt">
        <span aria-hidden="true">⚙</span>
      </button>
      <p class="tag">GLOBAL SUCCESS · TẬP 1</p>
      <h1 tabindex="-1">Mỗi ngày, một chút tiếng Anh!</h1>
      <p>Chọn bài trong sách rồi cùng nghe, đọc và viết.</p>
    </section>
    <h2>Chọn Unit</h2>
    <div class="unit-grid"></div>
  </template>
</body>
</html>
